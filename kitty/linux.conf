# Options
font_size 11.0

# Hints https://sw.kovidgoyal.net/kitty/kittens/hints
map alt+u kitten hints --type url

# App and window management
map shift+alt+w quit
map alt+w close_window
map alt+t new_tab_with_cwd
map alt+n new_os_window
map alt+r set_tab_title
map shift+alt+, load_config_file
map alt+, edit_config_file
map alt+d launch --cwd=current --location=vsplit
map shift+alt+d launch --cwd=current --location=hsplit
map alt+f search_scrollback

# Tab navigation
map shift+alt+[ move_tab_backward
map shift+alt+] move_tab_forward
map alt+[ previous_tab
map alt+] next_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Pane navigation
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

# Pane movement
map shift+alt+h move_window left
map shift+alt+l move_window right
map shift+alt+k move_window up
map shift+alt+j move_window down

# Pane resizing
map ctrl+alt+h resize_window narrower 2
map ctrl+alt+l resize_window wider 2
map ctrl+alt+k resize_window taller 2
map ctrl+alt+j resize_window shorter 2

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Utility shortcuts
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+0 change_font_size all 0
map ctrl+alt+, debug_config
map alt+p command_palette

# Sessions
map shift+alt+s save_as_session --use-foreground-process --base-dir ~/.config/kitty/sessions
map shift+alt+c close_session
map alt+/ goto_session ./sessions
